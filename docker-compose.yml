version: '3.8'

services:
  # ==========================================
  # Backend API Service
  # ==========================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rest_api_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://api_user:api_password@postgres_db:5432/api_db?schema=public
      - JWT_SECRET=production_secret_key_change_me_immediately
      - JWT_EXPIRES_IN=1d
    depends_on:
      postgres_db:
        condition: service_healthy
      redis_cache:
        condition: service_started
    networks:
      - app_network

  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres_db:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      - POSTGRES_USER=api_user
      - POSTGRES_PASSWORD=api_password
      - POSTGRES_DB=api_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U api_user -d api_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ==========================================
  # Redis Caching Service
  # ==========================================
  redis_cache:
    image: redis:7-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network:
    driver: bridge
